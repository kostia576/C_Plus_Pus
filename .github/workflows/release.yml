name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/homework_one

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev cmake build-essential
      
      - name: Configure CMake
        run: cmake . -DPATCH_VERSION=${{ github.run_number }} -DWITH_BOOST_TEST=ON
      
      - name: Build
        run: cmake --build .
      
      - name: Run tests
        run: ctest --output-on-failure
      
      - name: Package
        run: cmake --build . --target package
      
      - name: List generated files
        run: ls -la *.deb || echo "No .deb files found"
      
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }} 
          name: Release ${{ github.run_number }}
          files: ./helloworld-0.0.${{ github.run_number }}-Linux.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}