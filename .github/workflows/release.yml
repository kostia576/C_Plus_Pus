name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions
      - featurre/homework_2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libgtest-dev
          # Устанавливаем GoogleTest (если не установлен в системе)
          cd /usr/src/gtest
          sudo cmake -DCMAKE_BUILD_TYPE=Release .
          sudo make
          sudo cp lib/*.a /usr/lib || sudo cp *.a /usr/lib
      
      - name: Configure CMake
        run: |
          cmake . \
            -DPATCH_VERSION=${{ github.run_number }} \
            -DWITH_GTEST=ON \
            -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build . --config Release
      
      - name: Run tests
        run: |
          ctest --output-on-failure --ctest-config Release
          # Или напрямую запустить исполняемый файл тестов:
          # ./ip_utils_tests
      
      - name: Package
        run: cmake --build . --target package
      
      - name: List generated files
        run: ls -la *.deb || echo "No .deb files found"
      
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }} 
          name: Release v${{ github.run_number }}
          files: ./helloworld-0.0.${{ github.run_number }}-Linux.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}